<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Students of Cyber 3D logo">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- glow -->
  <circle cx="100" cy="100" r="92" fill="url(#glow)"/>

  <!-- 3D shield -->
  <g transform="translate(100 100)">
    <polygon points="0,-78 64,-52 64,18 0,80 -64,18 -64,-52"
             fill="url(#g2)" stroke="#34d399" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="0,-78 64,-52 0,-30 -64,-52"
             fill="#0b1220" opacity="0.55"/>
    <polygon points="0,-30 64,-52 64,18 0,80" fill="#0b1220" opacity="0.28"/>

    <!-- lock -->
    <g transform="translate(0 -6)">
      <rect x="-26" y="-8" width="52" height="44" rx="10" fill="#04121a" stroke="url(#g1)" stroke-width="3"/>
      <path d="M-16 -8 v-14 a16 16 0 0 1 32 0 v14" fill="none" stroke="url(#g1)" stroke-width="4"/>
      <circle cx="0" cy="14" r="6" fill="url(#g1)"/>
      <rect x="-2.5" y="14" width="5" height="14" rx="2.5" fill="url(#g1)"/>
    </g>

    <!-- floating cubes (3D study bits) -->
    <g opacity="0.9">
      <rect x="-78" y="-70" width="14" height="14" rx="2" fill="#22d3ee" transform="rotate(18 -71 -63)"/>
      <rect x="66" y="48" width="12" height="12" rx="2" fill="#34d399" transform="rotate(-15 72 54)"/>
      <circle cx="78" cy="-58" r="4" fill="#0ea5e9"/>
    </g>
  </g>

  <style>
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    svg{ animation: float 4s ease-in-out infinite; filter: drop-shadow(0 6px 16px rgba(34,211,238,.4)); }
  </style>
</svg>
